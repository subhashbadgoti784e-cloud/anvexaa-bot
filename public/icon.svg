<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Main Anvexaa 3D Neon Cyan to Violet Gradient -->
    <linearGradient id="anvexaa-main" x1="100" y1="80" x2="420" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="85%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Slicing Wing Gradient -->
    <linearGradient id="anvexaa-wing" x1="380" y1="180" x2="180" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Ambient Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="10 14" />

  <!-- Glowing 3D Anvexaa 'A' Glyph -->
  <g filter="url(#neon-glow)">
    <!-- Main Upright A Arch -->
    <path
      d="M 256 70 
         C 270 70, 284 78, 294 92
         L 430 325
         C 440 342, 432 362, 416 372
         L 355 402
         C 342 410, 324 405, 314 390
         L 256 295
         L 198 390
         C 188 405, 170 410, 157 402
         L 96 372
         C 80 362, 72 342, 82 325
         L 218 92
         C 228 78, 242 70, 256 70 Z"
      fill="url(#anvexaa-main)"
    />

    <!-- Sharp Dynamic Slicing Wing Bar -->
    <path
      d="M 145 275
         L 410 180
         C 428 174, 446 188, 442 206
         L 360 330
         C 350 344, 332 348, 318 340
         L 145 275 Z"
      fill="url(#anvexaa-wing)"
      opacity="0.95"
    />

    <!-- Negative Space Center Core -->
    <polygon 
      points="256,150 318,255 194,255" 
      fill="#020617" 
    />
  </g>

  <!-- Bottom Flare Dot -->
  <circle cx="256" cy="430" r="4" fill="#67E8F9" filter="drop-shadow(0 0 10px #38BDF8)" />
</svg>
